# Balanceo entre réplicas del API. Bajo despliegue rolling, cuando una
# réplica se reinicia, Nginx reintenta automáticamente contra otra sana
# (proxy_next_upstream) — el usuario nunca ve un error 502 por un deploy.
upstream api_backend {
    least_conn; # prioriza la réplica con menos conexiones activas, no round-robin ciego
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
    server api-3:3000 max_fails=3 fail_timeout=10s;
    keepalive 64; # reutiliza conexiones hacia el backend, evita el costo de abrir una por request
}

# Rate limiting a nivel de borde — primera línea de defensa antes de que
# la request siquiera llegue al API (protege contra picos/abuso agresivo).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;

    gzip on;
    gzip_types application/json;

    # Login: límite estricto y propio — anti brute-force a nivel de borde,
    # antes incluso del ThrottlerGuard de Nest.
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://api_backend;
        include /etc/nginx/proxy_params_api.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://api_backend;
        include /etc/nginx/proxy_params_api.conf;

        # Si la réplica elegida no responde (reiniciando por deploy),
        # reintenta automáticamente contra la siguiente — transparente
        # para el cliente, sin 502.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /health {
        access_log off;
        proxy_pass http://api_backend/api/v1/health/live;
    }
}
