server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre (vite build): cache de 1 año, son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea — así un deploy nuevo se ve al instante.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: cualquier ruta desconocida sirve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
