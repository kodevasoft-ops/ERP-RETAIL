x-api-common: &api-common
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    pgbouncer:
      condition: service_started
    redis:
      condition: service_healthy
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 512M }
      reservations: { cpus: "0.25", memory: 256M }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health/ready"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: erp_retail
    secrets: [db_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PgBouncer multiplexa cientos de conexiones lógicas (una por request
  # de cada réplica del API) sobre un pool pequeño y real hacia Postgres.
  # Sin esto, 3 réplicas × pool propio pueden agotar max_connections
  # de Postgres bajo picos de tráfico.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: "postgresql://erp:${DB_PASSWORD}@postgres:5432/erp_retail"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nota: en producción las fotos van a Cloudflare R2 (S3-compatible,
  # configurado vía S3_ENDPOINT/S3_PUBLIC_URL en .env.production) — no se
  # necesita un contenedor MinIO aquí. MinIO solo se usa en desarrollo
  # local (ver docker-compose.yml) para no depender de credenciales reales.
  # ---- 3 réplicas del API detrás del load balancer ----
  api-1:
    <<: *api-common
  api-2:
    <<: *api-common
  api-3:
    <<: *api-common

  # Worker de colas: proceso separado, escalable independientemente.
  # Si los reportes pesan más, se sube `--scale worker=3` sin tocar el API.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
      replicas: 1

  edge:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile.edge
    ports:
      - "80:80"
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  postgres_data:
  redis_data:
